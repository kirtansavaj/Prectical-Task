<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather</title>
  <link rel="stylesheet" href="/weather/frontend.css">

</head>

<body>
  <div class="weather">
    <div class="left">
      <div class="location" id="location"></div>
      <div class="temperature" id="temperature"></div>
    </div>
    <div class="right">
      <div class="condition" id="condition"></div>
      <div class="humidity" id="humidity"></div>
      <div class="windSpeed" id="windSpeed"></div>
    </div>
  </div>



  <!-- <script src="1.js"></script> -->
  <script>
    const left = document.querySelector('.left');
    const right = document.querySelector('.right');
    // const lower = document.querySelector('.lower');

    const weatherData = {
      location: "New York",
      temperature: 25,
      condition: "Sunny",
      humidity: 60,
      windSpeed: "15 Km/h"
    };

    left.innerHTML = `<h1>${weatherData.location}</h1><h2>${weatherData.temperature}°C</h2>`;
    right.innerHTML = `<p>condition: ${weatherData.condition}</p><p>Humidity: ${weatherData.humidity}%</p><p>Wind Speed: ${weatherData.windSpeed}</p>`;
    // lower.innerHTML = `<p>Humidity: ${weatherData.humidity}%</p><p>Wind Speed: ${weatherData.windSpeed}</p>`;    
  </script>


</body>

</html>
