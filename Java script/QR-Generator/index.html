<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Code Generator</title>
  <!-- <link rel="stylesheet" href="style.css"> -->
   <style>
    :root {
  --bcg-color: #f1f1f1;
  --primary-color: #70281f;
  --border-radius: 8px;
  --secondary-color: #fff;
  --border-color: #c97f7f;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: sans-serif;
}

body {
  width: 100%;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background-color: var(--bcg-color);
  
}

.box {
  background-color: var(--primary-color);
  padding: 30px;
  width: 400px;
  border-radius: var(--border-radius);
}

.qr-header h1 {
  font-size: 26px;
  text-align: center;
  color: var(--secondary-color);
  margin-bottom: 24px;
  text-transform: uppercase;
}

.qr-header input,
select {
  width: 100%;
  padding: 8px;
  font-size: 18px;
  border-radius: var(--border-radius);
  border: 2px solid var(--border-color);
  margin: 12px 0;
  outline: none;
}

.qr-header label {
  color: var(--secondary-color);
  font-size: 20px;
}

.qr-header div {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.qr-body {
  display: grid;
  place-items: center;
  padding: 20px;
}

.qr-body img {
  max-width: 100%;
  padding: 20px;
  margin: 10px 0;
  border: 0.5px solid var(--border-color);
  border-radius: var(--border-radius);
}

.qr-footer {
  display: flex;
  justify-content: center;
  gap: 10px;
}

.qr-footer a {
  background-color: var(--secondary-color);
  text-decoration: none;
  font-size: 18px;
  padding: 12px 24px;
  color: var(--primary-color);
  font-weight: 600;
  border-radius: var(--border-radius);
}

@media screen and (max-width: 520px) {
  .box {
    width: 80%;
  }

  .qr-footer a {
    padding: 10px;
    font-size: 16px;
  }
}
   </style>
</head>

<body>
  <div class="box">
    <div class="qr-header">
      <h1>Generate QR Code</h1>
      <h2>Type your text or URL</h2>
      <input type="text" id="qr-text" />
      <div>
        <label for="sizes">Select Size:</label>
      </div>
      <div>
        <select id="sizes">
          <option value="100">100x100</option>
          <option value="200">200x200</option>
          <option value="300">300x300</option>
        </select>
      </div>
    </div>
    <div class="qr-body"></div>
    <div class="qr-footer">
      <a href="#" id="generateBtn">Generate</a>
      <a href="#" id="downloadBtn" download="QR_Code.png">Download</a>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- <script src="script.js"></script> -->
   <script>
    const qrText = document.getElementById('qr-text');
const sizes = document.getElementById('sizes');
const generateBtn = document.getElementById('generateBtn');
const downloadBtn = document.getElementById('downloadBtn');
const qrContainer = document.querySelector('.qr-body');

let size = sizes.value;

generateBtn.addEventListener('click', (e) => {
  e.preventDefault();
  size = sizes.value;
  if (qrText.value.trim().length > 0) {
    generateQRCode();
  } else {
    alert("Enter the text or URL");
  }
});


downloadBtn.addEventListener('click', () => {
  const img = document.querySelector('.qr-body img') || document.querySelector('canvas');
  if (img) {
    const dataURL = img.src || img.toDataURL();
    downloadBtn.href = dataURL;
  }
});


function generateQRCode() {
  qrContainer.innerHTML = "";
  new QRCode(qrContainer, {
    text: qrText.value,
    width: size,
    height: size,
    colorDark: "#000",
    colorLight: "#fff"
  });
}
   </script>

</body>

</html>
