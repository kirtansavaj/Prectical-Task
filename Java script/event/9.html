<!-- Develop a slider where the images change every few seconds automatically and also manually on button clicks. -->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    /* background: #ffffff; */
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  .slider {
    position: relative;
    width: 600px;
    height: 400px;
    overflow: hidden;
    border-radius: 10px;
    box-shadow: 0 0 15px rgba(0,0,0,0.5);
    background: #000;
  }
  .slider img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: opacity 0.5s ease;
  }
  .btn {
    position: absolute;
    top: 50%;
    z-index: 10;
    background: rgba(0,0,0,0.4);
    border: none;
    color: #fff;
    font-size: 2rem;
    padding: 0 12px;
    cursor: pointer;
    user-select: none;
    border-radius: 50%;
    transform: translateY(-50%);
    transition: background 0.1s ease;
  }
  .btn:hover {
    background: rgba(0,0,0,0.7);
  }
  #prevBtn {
    left: 10px;
  }
  #nextBtn {
    right: 10px;
  }
</style>
</head>
<body>

<div class="slider">
  <button class="btn" id="prevBtn">&#10094;</button>
  <img id="slider-image" src="https://picsum.photos/id/1018/600/400" alt="Slider Image" />
  <button class="btn" id="nextBtn">&#10095;</button>
</div>

<script>
  const images = [
    "https://picsum.photos/id/1018/600/400",
    "https://picsum.photos/id/1015/600/400",
    "https://picsum.photos/id/1019/600/400",
    "https://picsum.photos/id/1020/600/400",
    "https://picsum.photos/id/1021/600/400",
    "https://plus.unsplash.com/premium_photo-1707563544861-d7d1c01c3ea0?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8ZGVza3RvcCUyMHdhbGxwYXBlcnN8ZW58MHx8MHx8fDA%3D",
    "https://images.unsplash.com/photo-1485470733090-0aae1788d5af?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8ZGVza3RvcCUyMHdhbGxwYXBlcnN8ZW58MHx8MHx8fDA%3D",
    "https://images.unsplash.com/photo-1502657877623-f66bf489d236?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NHx8ZGVza3RvcCUyMHdhbGxwYXBlcnN8ZW58MHx8MHx8fDA%3D",
    "https://plus.unsplash.com/premium_photo-1668090758448-45e8ecbe1a8c?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NXx8ZGVza3RvcCUyMHdhbGxwYXBlcnN8ZW58MHx8MHx8fDA%3D"
  ];

  let currentIndex = 0;
  const imgElement = document.getElementById('slider-image');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  let autoSlideInterval = null;
  const intervalTime = 3000;

  function showImage(index) {
    if (index < 0) {
      currentIndex = images.length - 1;
    } else if (index >= images.length) {
      currentIndex = 0;
    } else {
      currentIndex = index;
    }
    imgElement.style.opacity = 0;
    setTimeout(() => {
      imgElement.src = images[currentIndex];
      imgElement.style.opacity = 1;
    }, 200);
  }

  function nextImage() {
    showImage(currentIndex + 1);
  }

  function prevImage() {
    showImage(currentIndex - 1);
  }

  function startAutoSlide() {
    autoSlideInterval = setInterval(() => {
      nextImage();
    }, intervalTime);
  }

  function resetAutoSlide() {
    clearInterval(autoSlideInterval);
    startAutoSlide();
  }

  // Event listeners
  nextBtn.addEventListener('click', () => {
    nextImage();
    resetAutoSlide();
  });

  prevBtn.addEventListener('click', () => {
    prevImage();
    resetAutoSlide();
  });

  // Initialize
  showImage(currentIndex);
  startAutoSlide();
</script>

</body>
</html>
