<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>API Ch</title>
</head>
<body>
  <p id="result"></p>

  <script>
    let api = new Promise(function(resolve, reject) {
      fetch("https://meme-api.com/gimme")
        .then(response => {
          if (response) {
            resolve("ok");
          } else {
            reject("error");
          }
        })
        .catch(() => {
          reject("error");
        });
    });

    api
      .then(result => {
        document.getElementById("result").textContent = result;
      })
      .catch(error => {
        document.getElementById("result").textContent = error;
      });
  </script>
</body>
</html>
